<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Table Badness</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<link rel="stylesheet" href="src/table.css">
<style>
/* Layout: a control rail on top, then one full-width proof strip per method, stacked so tables share one width ruler. */
:root {
  --bg: #f6f7f9; --panel: #ffffff; --fg: #17202b; --muted: #5b6676; --line: #d9dee5;
  --accent: #0f6e6a; --accent-soft: #dbefed; --good: #1d7a3a; --bad: #b4372a; --warn: #9a6a00;
  --tb-border: #cfd5dd; --tb-head: #eef1f4; --tb-code: #e9edf1; --tb-link: #1d5fd6;
  --ruler: #e0465f;
  --f-display: "Space Grotesk", "IBM Plex Sans", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "PingFang SC", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161c; --panel: #171e26; --fg: #e4e9ef; --muted: #98a3b1; --line: #2a333e;
  --accent: #5cc4bc; --accent-soft: #173a38; --good: #5fc27a; --bad: #f07a6a; --warn: #e2b44c;
  --tb-border: #35404d; --tb-head: #1f2832; --tb-code: #24303b; --tb-link: #7db0ff; --ruler: #ff6f86; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11161c; --panel: #171e26; --fg: #e4e9ef; --muted: #98a3b1; --line: #2a333e;
  --accent: #5cc4bc; --accent-soft: #173a38; --good: #5fc27a; --bad: #f07a6a; --warn: #e2b44c;
  --tb-border: #35404d; --tb-head: #1f2832; --tb-code: #24303b; --tb-link: #7db0ff; --ruler: #ff6f86; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
.page { max-width: 1240px; margin: 0 auto; display: grid; gap: 18px; }
header h1 { font: 600 26px/1.15 var(--f-display); margin: 0; letter-spacing: -0.01em; }
header p { margin: 6px 0 0; color: var(--muted); max-width: 72ch; text-wrap: pretty; }
.controls { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
@media (max-width: 820px) { .controls { grid-template-columns: minmax(0, 1fr); } }
.field { display: grid; gap: 6px; min-width: 0; align-content: start; }
.field.md { grid-template-rows: auto 1fr; }
.field > label, .lbl { font: 500 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
select, textarea, input[type=number] { font: 13px/1.45 var(--f-mono); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; }
textarea { width: 100%; min-height: 168px; resize: vertical; white-space: pre; overflow: auto; }
select:focus-visible, textarea:focus-visible, input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
input[type=range] { flex: 1 1 200px; accent-color: var(--accent); min-width: 0; }
#wnum { width: 84px; }
.methods { display: flex; flex-wrap: wrap; gap: 6px; }
.chk { display: inline-flex; gap: 6px; align-items: center; padding: 4px 9px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; font-size: 12.5px; user-select: none; }
.chk:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.chk input { accent-color: var(--accent); margin: 0; }
.right { display: grid; gap: 14px; align-content: start; min-width: 0; }
.timing { font: 12px/1.6 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.timing b { color: var(--fg); font-weight: 500; }
.note { font-size: 12.5px; color: var(--muted); }
.panels { display: grid; gap: 14px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px 14px; display: grid; gap: 10px; min-width: 0; }
.panel.ours { border-color: var(--accent); }
.phead { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; justify-content: space-between; }
.pname { font: 600 15px/1.2 var(--f-display); }
.pname small { font: 400 12px var(--f-body); color: var(--muted); margin-left: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; font: 12px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.chip { padding: 5px 7px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); white-space: nowrap; }
.chip i { font-style: normal; color: var(--muted); margin-right: 4px; }
.chip.best { border-color: var(--good); color: var(--good); }
.chip.worst { border-color: var(--bad); color: var(--bad); }
.viewport { overflow-x: auto; padding-bottom: 4px; min-width: 0; }
.tb-wrap { outline: 1px dashed var(--ruler); outline-offset: 0; background: var(--panel); }
.chart { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.chart h2, .panels-title { font: 600 15px/1.2 var(--f-display); margin: 0; }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.charts svg { width: 100%; height: auto; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font: 11.5px var(--f-mono); color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 3px; margin-right: 5px; vertical-align: middle; background: currentColor; }
.flag { font: 500 11px/1 var(--f-mono); padding: 3px 6px; border-radius: 3px; background: var(--bad); color: var(--panel); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Table Badness</h1>
    <p>可读性感知的表格列宽分配。每张表都是真实 HTML 表格，由浏览器按相同字体、内边距和断行规则排版；粉色虚线框是可用宽度。指标从实际渲染结果测量，不取自算法的预测。</p>
  </header>

  <section class="controls" aria-label="控制">
    <div class="field md">
      <label for="md">Markdown 表格（可编辑、可粘贴）</label>
      <textarea id="md" spellcheck="false"></textarea>
    </div>
    <div class="right">
      <div class="field">
        <label for="case">案例</label>
        <select id="case"></select>
      </div>
      <div class="field">
        <label for="w">可用宽度</label>
        <div class="row"><input id="w" type="range" min="240" max="1100" step="1" value="480"><input id="wnum" type="number" min="160" max="2000" value="480" aria-label="可用宽度（像素）"><span class="note">px</span></div>
      </div>
      <div class="row">
        <div class="field"><label for="fs">字号</label>
          <select id="fs"><option>13</option><option>14</option><option selected>15</option><option>16</option><option>18</option></select></div>
        <div class="field"><label for="scroll">横向滚动</label>
          <select id="scroll"><option value="1" selected>按成本决策</option><option value="0">仅在放不下时</option></select></div>
      </div>
      <div class="field"><span class="lbl">对比方法</span><div class="methods" id="methods"></div></div>
      <div class="timing" id="timing"></div>
    </div>
  </section>

  <section class="panels" id="panels" aria-label="布局对比"></section>

  <section class="chart" aria-label="列宽路径">
    <h2>列宽随可用宽度的变化</h2>
    <p class="note" style="margin:0">Table Badness 只计算一次列宽路径；可用宽度变化时只查表，每列宽度单调不减。最小高度优化每个宽度单独求解，列宽会来回跳动。竖线是当前宽度。</p>
    <div class="charts" id="charts"></div>
    <div class="legend" id="legend"></div>
  </section>
</div>

<script src="src/markdown.js"></script>
<script src="src/tablebadness.js"></script>
<script src="src/baselines.js"></script>
<script src="src/metrics.js"></script>
<script src="data/cases.js"></script>
<script>
(function () {
  'use strict';
  const TB = TableBadness, BL = TBBaselines, MD = TBMarkdown, MT = TBMetrics;
  const METHODS = [
    { id: 'css-auto', name: '浏览器原生', note: 'table-layout: auto' },
    { id: 'equal', name: '等宽', note: '' },
    { id: 'proportional', name: '内容比例', note: '按平均单行宽度' },
    { id: 'min-height', name: '最小高度', note: '成对交换局部搜索' },
    { id: 'tb-fit', name: 'Table Badness', note: '不主动滚动' },
    { id: 'tb-path', name: 'Table Badness', note: '默认' },
  ];
  const shown = new Set(['css-auto', 'min-height', 'tb-path']);
  const $ = id => document.getElementById(id);
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

  // case selector
  const sel = $('case');
  for (const [set, label] of [['dev', '开发集'], ['val', '独立验证集（未用于调参）']]) {
    const g = document.createElement('optgroup'); g.label = label;
    TB_CASES.filter(c => c.set === set).forEach(c => { const o = document.createElement('option'); o.value = c.id; o.textContent = c.title; g.appendChild(o); });
    sel.appendChild(g);
  }
  const g2 = document.createElement('optgroup'); g2.label = '自定义';
  g2.innerHTML = '<option value="custom">粘贴的表格</option>'; sel.appendChild(g2);

  // method toggles
  for (const m of METHODS) {
    const l = document.createElement('label'); l.className = 'chk';
    l.innerHTML = `<input type="checkbox" id="m-${m.id}" ${shown.has(m.id) ? 'checked' : ''}>${m.name}${m.note ? ' · ' + m.note : ''}`;
    l.querySelector('input').addEventListener('change', e => { e.target.checked ? shown.add(m.id) : shown.delete(m.id); build(); });
    $('methods').appendChild(l);
  }

  let panels = [], lang = 'zh-CN', tbCtx = null, timingInfo = {};

  function currentW() { return Math.max(160, +$('wnum').value || 480); }
  function fs() { return +$('fs').value; }

  function build() {
    const md = $('md').value;
    const t = MD.parseTable(md);
    const host = $('panels');
    host.innerHTML = '';
    panels = [];
    if (!t) { host.innerHTML = '<p class="note">没有找到 Markdown 表格：需要表头行和分隔行（如 <code>|---|---|</code>）。</p>'; return; }
    const html = MD.toHTML(t);
    const t0 = performance.now();
    const cachedBefore = TB._cache.size;
    for (const m of METHODS) {
      if (!shown.has(m.id)) continue;
      const el = document.createElement('article');
      el.className = 'panel' + (m.id.startsWith('tb') ? ' ours' : '');
      el.innerHTML = `<div class="phead"><div class="pname">${m.name}<small>${m.note}</small></div><div class="chips"></div></div><div class="viewport"><div class="tb-wrap"></div></div>`;
      const wrap = el.querySelector('.tb-wrap');
      wrap.lang = lang;
      wrap.style.setProperty('--tb-font-size', fs() + 'px');
      wrap.innerHTML = html;
      host.appendChild(el);
      panels.push({ m, el, wrap, table: wrap.querySelector('table') });
    }
    // prepare (first table measures; the rest hit the shared cell cache)
    for (const p of panels) {
      const a = performance.now();
      p.P = TB.prepareTable(p.table, { scroll: $('scroll').value === '1' });
      p.prepMs = performance.now() - a;
      if (p.m.id.startsWith('tb')) {
        const b = performance.now();
        p.path = TB.buildPath(p.P);
        p.pathMs = performance.now() - b;
      }
    }
    const first = panels[0];
    timingInfo = {
      prepMs: first ? first.P.timing.prepareMs : 0, measured: first ? first.P.timing.measuredCells : 0,
      distinct: first ? first.P.cols.reduce((s, c) => s + c.entries.length, 0) : 0,
      cacheHit: cachedBefore > 0, buildAll: performance.now() - t0,
    };
    // reference context for the chart and timing (always available)
    const ref = document.createElement('div');
    ref.style.cssText = 'position:absolute;left:-99999px;top:0;';
    ref.lang = lang; ref.style.setProperty('--tb-font-size', fs() + 'px');
    ref.className = 'tb-wrap'; ref.innerHTML = html;
    document.body.appendChild(ref);
    const P = TB.prepareTable(ref.querySelector('table'), { scroll: $('scroll').value === '1' });
    const a = performance.now(); const path = TB.buildPath(P); const pathMs = performance.now() - a;
    tbCtx = { P, path, ref };
    timingInfo.pathMs = pathMs; timingInfo.steps = path.segs.length;
    relayout();
    drawCharts();
    ref.remove();
  }

  function layoutFor(p, W) {
    const P = p.P;
    switch (p.m.id) {
      case 'equal': return BL.equal(P, W);
      case 'proportional': return BL.proportional(P, W);
      case 'min-height': return BL.minHeight(P, W, [BL.proportional(P, W).widths]);
      case 'tb-fit': return TB.layoutAt(Object.assign({}, P, { opts: Object.assign({}, P.opts, { scroll: false }) }), p.path, W);
      case 'tb-path': return TB.layoutAt(P, p.path, W);
    }
    return null;
  }

  const fmtMs = ms => (ms < 0.1 ? (ms * 1000).toFixed(0) + ' µs' : ms.toFixed(2) + ' ms');

  function relayout() {
    const W = currentW();
    const results = [];
    let tbQuery = null;
    for (const p of panels) {
      p.wrap.style.width = W + 'px';
      let L = null, ms;
      if (p.m.id === 'css-auto') {
        TB.clearWidths(p.table);
        const a = performance.now(); void p.table.offsetHeight; ms = performance.now() - a;
      } else {
        const a = performance.now(); L = layoutFor(p, W); ms = performance.now() - a;
        TB.applyWidths(p.table, L);
        if (p.m.id === 'tb-path') {
          const b = performance.now(); for (let i = 0; i < 200; i++) TB.layoutAt(p.P, p.path, W - i % 7); tbQuery = (performance.now() - b) / 200;
        }
      }
      const met = MT.measure(p.P, W, p.wrap);
      results.push({ p, met, ms, L });
    }
    // chips, best/worst marking across shown methods
    const keys = [
      { k: 'short', label: '短值完整', v: r => r.met.shortCells ? r.met.shortIntact / r.met.shortCells : null, fmt: r => `${r.met.shortIntact}/${r.met.shortCells}`, hi: true },
      { k: 'atomic', label: '词内断开', v: r => r.met.atomicBreaks, fmt: r => String(r.met.atomicBreaks), hi: false },
      { k: 'frag', label: '长文碎片化', v: r => r.met.longCells ? r.met.severeFrag : null, fmt: r => r.met.longCells ? `${r.met.severeFrag}/${r.met.longCells}` : '—', hi: false },
      { k: 'h', label: '总高', v: r => r.met.heightPx, fmt: r => Math.round(r.met.heightPx) + 'px', hi: false },
      { k: 'ovf', label: '横向溢出', v: r => r.met.overflowPx, fmt: r => Math.round(r.met.overflowPx) + 'px', hi: false },
    ];
    for (const r of results) {
      const chips = r.p.el.querySelector('.chips');
      chips.innerHTML = '';
      for (const key of keys) {
        const vals = results.map(key.v).filter(x => x != null);
        const v = key.v(r);
        const best = key.hi ? Math.max(...vals) : Math.min(...vals), worst = key.hi ? Math.min(...vals) : Math.max(...vals);
        const c = document.createElement('span');
        c.className = 'chip' + (v != null && vals.length > 1 && best !== worst ? (Math.abs(v - best) < 1e-9 ? ' best' : Math.abs(v - worst) < 1e-9 ? ' worst' : '') : '');
        c.innerHTML = `<i>${key.label}</i>${key.fmt(r)}`;
        chips.appendChild(c);
      }
      const t = document.createElement('span'); t.className = 'chip';
      t.innerHTML = `<i>${r.p.m.id === 'css-auto' ? '浏览器重排' : '求解'}</i>${fmtMs(r.ms)}`;
      chips.appendChild(t);
      if (r.L && r.L.scroll) { const s = document.createElement('span'); s.className = 'chip'; s.innerHTML = '<i>决策</i>横向滚动'; chips.appendChild(s); }
    }
    const T = timingInfo;
    $('timing').innerHTML =
      `预处理 <b>${T.prepMs.toFixed(1)} ms</b>（${T.cacheHit && !T.measured ? '全部命中缓存' : '测量 ' + T.measured + ' 个新单元格'}，去重后 ${T.distinct} 个）<br>` +
      `列宽路径 <b>${T.pathMs.toFixed(2)} ms</b>（${T.steps} 步，与宽度无关，只算一次）<br>` +
      (tbQuery != null ? `每次调整宽度 <b>${fmtMs(tbQuery)}</b>（二分查表，不触发排版测量）` : '勾选 Table Badness 以查看实时布局耗时');
    drawMarker();
  }

  // ---- width schedule charts ----
  const PALETTE = ['#0f6e6a', '#c2410c', '#6d28d9', '#1d4ed8', '#b45309', '#be185d', '#15803d', '#475569', '#0e7490', '#9f1239'];
  let chartState = null;
  function drawCharts() {
    const { P, path } = tbCtx;
    const Wmin = 240, Wmax = 1100, step = 10;
    const series = { 'Table Badness 路径': [], '最小高度（逐宽度求解）': [] };
    for (let W = Wmin; W <= Wmax; W += step) {
      series['Table Badness 路径'].push([W, TB.layoutAt(P, path, W).colPx]);
      series['最小高度（逐宽度求解）'].push([W, BL.minHeight(P, W, [BL.proportional(P, W).widths]).colPx]);
    }
    let ymax = 0;
    for (const s of Object.values(series)) for (const [, ws] of s) for (const w of ws) ymax = Math.max(ymax, w);
    ymax = Math.ceil(ymax / 100) * 100 || 100;
    const host = $('charts'); host.innerHTML = '';
    const VW = 520, VH = 220, L = 40, R = 10, Tm = 22, B = 26;
    const x = W => L + (W - Wmin) / (Wmax - Wmin) * (VW - L - R);
    const y = v => VH - B - v / ymax * (VH - Tm - B);
    chartState = { x, svgs: [], Tm, B, VH };
    for (const [name, pts] of Object.entries(series)) {
      let s = `<svg viewBox="0 0 ${VW} ${VH}" role="img" aria-label="${name}"><text x="${L}" y="14" fill="var(--fg)" font-family="var(--f-display)" font-size="12.5" font-weight="600">${name}</text>`;
      for (let v = 0; v <= ymax; v += ymax / 4) s += `<line x1="${L}" x2="${VW - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" fill="var(--muted)" font-size="10" font-family="var(--f-mono)">${Math.round(v)}</text>`;
      for (const W of [300, 500, 700, 900, 1100]) s += `<text x="${x(W)}" y="${VH - 8}" text-anchor="middle" fill="var(--muted)" font-size="10" font-family="var(--f-mono)">${W}</text>`;
      for (let j = 0; j < P.nCols; j++) {
        const d = pts.map(([W, ws], i) => `${i ? 'L' : 'M'}${x(W).toFixed(1)},${y(ws[j]).toFixed(1)}`).join('');
        s += `<path d="${d}" fill="none" stroke="${PALETTE[j % PALETTE.length]}" stroke-width="1.6" stroke-linejoin="round"/>`;
      }
      s += `<line class="marker" x1="0" x2="0" y1="${Tm}" y2="${VH - B}" stroke="var(--ruler)" stroke-width="1.2" stroke-dasharray="3 3"/></svg>`;
      const div = document.createElement('div'); div.innerHTML = s; host.appendChild(div);
      chartState.svgs.push(div.querySelector('.marker'));
    }
    const head = MD.parseTable($('md').value).header;
    $('legend').innerHTML = head.map((h, j) => `<span style="color:${PALETTE[j % PALETTE.length]}">${h.replace(/[`*]/g, '').replace(/</g, '&lt;')}</span>`).join('') + '<span style="color:var(--muted)">纵轴：列宽 px · 横轴：可用宽度 px</span>';
    drawMarker();
  }
  function drawMarker() {
    if (!chartState) return;
    const X = chartState.x(Math.min(1100, Math.max(240, currentW())));
    for (const m of chartState.svgs) { m.setAttribute('x1', X); m.setAttribute('x2', X); }
  }

  // ---- events ----
  function loadCase(id) {
    const c = TB_CASES.find(c => c.id === id);
    if (c) { $('md').value = c.md.trim(); lang = c.lang; }
    store.set('tb-case', id);
    build();
  }
  sel.addEventListener('change', () => { if (sel.value !== 'custom') loadCase(sel.value); });
  let editTimer = null;
  $('md').addEventListener('input', () => { sel.value = 'custom'; lang = /[぀-ヿ]/.test($('md').value) ? 'ja' : 'zh-CN'; clearTimeout(editTimer); editTimer = setTimeout(build, 180); });
  let raf = 0;
  const onW = v => { $('w').value = v; $('wnum').value = v; store.set('tb-w', v); cancelAnimationFrame(raf); raf = requestAnimationFrame(relayout); };
  $('w').addEventListener('input', e => onW(e.target.value));
  $('wnum').addEventListener('change', e => onW(e.target.value));
  $('fs').addEventListener('change', build);
  $('scroll').addEventListener('change', build);

  const w0 = store.get('tb-w') || String(Math.min(480, Math.max(280, window.innerWidth - 40)));
  $('w').value = w0; $('wnum').value = w0;
  const c0 = store.get('tb-case');
