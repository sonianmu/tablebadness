<title>Gold Table Corpus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#f6f5f1;--panel:#fffefb;--ink:#1d232b;--muted:#5d6672;--faint:#8a929c;--line:#e2dfd6;--accent:#2f5d8a;--accent-soft:#e4ecf5;
--gold:#9a6a00;--gold-soft:#fbefcf;--good:#2e6b3f;--good-soft:#e2f1e5;--ok:#5f6670;--ok-soft:#eceef1;--bad:#a23b2c;--bad-soft:#f8e3df;--pos:#2e6b3f;--neg:#a23b2c;--chip:#efede6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181c;--panel:#1d2126;--ink:#e7e9ec;--muted:#a3abb5;--faint:#7c8590;--line:#30363d;--accent:#8db7e3;--accent-soft:#22313f;
--gold:#f0c35a;--gold-soft:#3a3020;--good:#8fd3a0;--good-soft:#1f3326;--ok:#b5bcc5;--ok-soft:#2a2f35;--bad:#f09a8c;--bad-soft:#3b2421;--pos:#8fd3a0;--neg:#f09a8c;--chip:#262b31;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181c;--panel:#1d2126;--ink:#e7e9ec;--muted:#a3abb5;--faint:#7c8590;--line:#30363d;--accent:#8db7e3;--accent-soft:#22313f;
--gold:#f0c35a;--gold-soft:#3a3020;--good:#8fd3a0;--good-soft:#1f3326;--ok:#b5bcc5;--ok-soft:#2a2f35;--bad:#f09a8c;--bad-soft:#3b2421;--pos:#8fd3a0;--neg:#f09a8c;--chip:#262b31;color-scheme:dark}
*{box-sizing:border-box}.specimen *{box-sizing:content-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans",sans-serif;margin:0}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
aside{border-right:1px solid var(--line);background:var(--panel);padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:12px;position:sticky;top:0;height:100vh;overflow:auto}
main{padding-block:20px 60px;padding-left:24px;padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
h1{font-size:17px;margin:0 0 2px;letter-spacing:.01em}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.filters{display:grid;gap:6px;margin-bottom:10px}
.filters select,.filters input{width:100%;font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.list{display:grid;gap:2px}
.item{display:grid;grid-template-columns:10px 1fr;gap:8px;align-items:start;padding:6px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.item:hover{background:var(--chip)}.item.on{background:var(--accent-soft);border-color:var(--accent)}
.item b{font-weight:600;font-size:12.5px;display:block;word-break:break-all}.item span{color:var(--muted);font-size:12px;display:block}
.dot{width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--ok)}
.dot.gold{background:var(--gold)}.dot.contested{background:#c98a3a}.dot.unresolved{background:var(--bad)}
.head h2{font-size:22px;margin:0 0 6px;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{background:var(--chip);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--muted)}
.chip.s-gold{background:var(--gold-soft);color:var(--gold);font-weight:600}.chip.s-contested{background:#f6e6cf;color:#8a5a10}.chip.s-unresolved{background:var(--bad-soft);color:var(--bad)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:14px 0 16px;flex-wrap:wrap}
.tabs button{font:inherit;background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--muted);cursor:pointer}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}.seg button{font:inherit;font-size:12.5px;border:0;background:var(--panel);color:var(--muted);padding:4px 10px;cursor:pointer}.seg button.on{background:var(--accent-soft);color:var(--ink)}
.grid{display:grid;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.card h3{margin:0;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lab{font-size:11.5px;font-weight:600;border-radius:4px;padding:1px 7px;text-transform:uppercase;letter-spacing:.04em}
.lab.gold{background:var(--gold-soft);color:var(--gold)}.lab.good{background:var(--good-soft);color:var(--good)}.lab.acceptable,.lab.unclear{background:var(--ok-soft);color:var(--ok)}.lab.bad{background:var(--bad-soft);color:var(--bad)}
.meta{color:var(--muted);font-size:12.5px;margin:4px 0 10px}
.specimen{background:#fff;color:#17202b;border-radius:6px;padding:12px;overflow-x:auto;border:1px solid var(--line)}
.vpbox{outline:1px dashed #e0465f;position:relative}
.vpnote{font-size:11.5px;color:#8a929c;margin-top:6px}
.specimen img{display:block;max-width:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px 14px;margin:10px 0 0;font-size:12.5px}
.stats div{color:var(--muted)}.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.dims{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;font-size:12px;align-items:center;margin-top:8px;max-width:360px}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
details{margin-top:8px}summary{cursor:pointer;color:var(--accent);font-size:12.5px}
.why{font-size:12.5px;color:var(--ink);margin:6px 0 0;padding-left:12px;border-left:2px solid var(--line)}
.wbar{display:flex;height:22px;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-top:8px;font-size:10.5px;font-variant-numeric:tabular-nums}
.wbar span{display:flex;align-items:center;justify-content:center;border-right:1px solid var(--panel);background:var(--accent-soft);color:var(--ink);overflow:hidden;white-space:nowrap}
.wbar span.up{background:var(--good-soft)}.wbar span.down{background:var(--bad-soft)}
table.dat{border-collapse:collapse;font-size:12.5px;width:100%;font-variant-numeric:tabular-nums}
table.dat th,table.dat td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
table.dat th{color:var(--muted);font-weight:600}
table.dat tr.sel{background:var(--accent-soft)}table.dat tbody tr{cursor:pointer}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.play input[type=number]{width:64px;font:inherit;padding:3px 5px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink)}
.play label{font-size:12px;color:var(--muted);display:inline-flex;flex-direction:column;gap:2px;margin-right:6px}
.prose p,.prose li{max-width:75ch}.prose h4{margin:16px 0 4px;font-size:13.5px}.prose ul{margin:4px 0;padding-left:20px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:4px 12px;font-size:13px}.kv div:nth-child(odd){color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);max-width:80ch}
.menu{display:none}
@media (max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto;max-height:50vh;border-right:0;border-bottom:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px))}main{padding-left:max(16px,env(safe-area-inset-left,0px))}}
/*TABLE_CSS*/
</style>
<div class="app">
<aside>
  <h1>Gold Table Corpus</h1>
  <p class="sub" id="sum"></p>
  <div class="filters">
    <input id="q" placeholder="Search id, title, language…">
    <select id="fsplit"><option value="">All splits</option><option>research</option><option>validation</option><option>holdout</option></select>
    <select id="fstatus"><option value="">All statuses</option><option>gold</option><option>contested</option><option>unresolved</option></select>
  </div>
  <div class="list" id="list"></div>
</aside>
<main id="main"></main>
</div>
<script>/*DATA*/</script>
<script>
(function(){
const D = window.GOLD || [], $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GR = ['', 'bad', 'poor', 'acceptable', 'good', 'excellent'];
let cur = null, tab = 'layouts', mode = 'live', cmp = [null, null], landSel = null;
try { mode = localStorage.getItem('gold-mode') || 'live'; } catch (e) {}
const hasShots = location.protocol === 'file:' || location.hostname === 'localhost';
if (!hasShots) mode = 'live';
const S = window.GOLD_INDEX;
$('#sum').textContent = `${D.length} scenarios · ${D.filter(d => d.status === 'gold').length} with a gold layout · gold-v1`;

function renderList() {
  const q = $('#q').value.toLowerCase(), sp = $('#fsplit').value, st = $('#fstatus').value;
  const xs = D.filter(d => (!sp || d.split === sp) && (!st || d.status === st) && (!q || (d.id + ' ' + d.table.title + ' ' + d.table.lang + ' ' + d.table.structure).toLowerCase().includes(q)));
  $('#list').innerHTML = xs.map(d => `<div class="item${cur && cur.id === d.id ? ' on' : ''}" data-id="${esc(d.id)}"><i class="dot ${esc(d.status)}"></i><div><b>${esc(d.id)}</b><span>${esc(d.table.title)}</span></div></div>`).join('') || '<p class="note">No match.</p>';
}
$('#list').addEventListener('click', e => { const it = e.target.closest('.item'); if (it) open(it.dataset.id); });
['#q', '#fsplit', '#fstatus'].forEach(s => $(s).addEventListener('input', renderList));

// ---- live render: exactly the corpus rendering (table.css, colgroup widths, table-layout fixed) ----
function tableNode(d, widths, opts = {}) {
  const outer = document.createElement('div');
  const wrap = document.createElement('div');
  wrap.className = 'vpbox';
  wrap.style.width = d.cond.availableWidth + 'px';
  wrap.style.setProperty('--tb-font-size', d.cond.fontSize + 'px');
  wrap.lang = d.table.lang; wrap.dir = /^(ar|he|fa|ur)/.test(d.table.lang) ? 'rtl' : 'ltr';
  wrap.innerHTML = d.table.html;
  const t = wrap.querySelector('table');
  if (widths) {
    const cg = document.createElement('colgroup');
    cg.innerHTML = widths.map(w => `<col style="width:${w}px">`).join('');
    t.insertBefore(cg, t.firstChild);
    t.style.tableLayout = 'fixed'; t.style.width = (widths.reduce((a, b) => a + b, 0) + 1) + 'px'; t.style.maxWidth = 'none';
  }
  outer.appendChild(wrap);
  if (opts.note !== false) { const n = document.createElement('div'); n.className = 'vpnote'; n.textContent = `dashed box = ${d.cond.availableWidth}px viewport${d.cond.policy === 'scroll-allowed' ? ' · content right of it is reached by scrolling' : ''}`; outer.appendChild(n); }
  return outer;
}
function specimen(d, L, which) {
  const box = document.createElement('div'); box.className = 'specimen';
  const src = which === 'vp' ? L.vp : L.shot;
  if (mode === 'shot' && src) {
    const im = new Image(); im.src = src; im.alt = 'Rendered layout ' + L.name; im.loading = 'lazy';
    im.onerror = () => { box.innerHTML = ''; box.appendChild(tableNode(d, L.requestedWidths)); };
    box.appendChild(im);
  } else box.appendChild(tableNode(d, L.requestedWidths));
  return box;
}
function wbar(d, ws, ref) {
  const tot = Math.max(d.cond.availableWidth, ws.reduce((a, b) => a + b, 0));
  return `<div class="wbar" title="column widths (px)">${ws.map((w, i) => { const dd = ref ? Math.round(w - ref[i]) : 0; return `<span class="${dd > 0 ? 'up' : dd < 0 ? 'down' : ''}" style="width:${(w / tot * 100).toFixed(2)}%">${Math.round(w)}${dd ? (dd > 0 ? ' +' : ' ') + dd : ''}</span>`; }).join('')}</div>`;
}
function dims(c) {
  const m = c.review.dimMeans || {};
  return `<div class="dims">${Object.entries(m).map(([k, v]) => `<span>${esc(k)}</span><div class="bar"><i style="width:${(v || 0) / 5 * 100}%"></i></div><b>${v == null ? '–' : v.toFixed(1)}</b>`).join('')}</div>`;
}
const originName = o => /^d\d$/.test(o) ? `independent designer ${o.slice(1)}` : o === 'synth' ? 'synthesis' : o === 'visual-corpus-v1' ? 'earlier Visual-Corpus preferred' : o;

function open(id) {
  cur = D.find(d => d.id === id); if (!cur) return;
  landSel = null; cmp = [cur.top, cur.candidates.find(c => c.name !== cur.top)?.name || cur.top];
  try { history.replaceState(null, '', '#' + id.replace(/[^a-zA-Z0-9-]/g, '-')); } catch (e) {}
  renderList(); draw();
}
function draw() {
  const d = cur, m = $('#main');
  const st = d.status;
  m.innerHTML = `<div class="head"><h2>${esc(d.table.title)}</h2>
  <div class="chips"><span class="chip s-${esc(st)}">${esc(st)}</span><span class="chip">${esc(d.split)}</span><span class="chip">${esc(d.origin)}</span><span class="chip">${esc(d.table.lang)}</span><span class="chip">${esc(d.table.structure)}</span><span class="chip">${d.cond.availableWidth}px · ${d.cond.fontSize}px font</span><span class="chip">${esc(d.cond.policy)}</span><span class="chip">${esc(d.id)}</span></div>
  <p class="note">${d.table.source && /^https:/.test(d.table.source) ? `Source: <a href="${esc(d.table.source)}" target="_blank" rel="noopener">${esc(d.table.source)}</a> (${esc(d.table.licence || '')})${d.table.edits ? ' · ' + esc(d.table.edits) : ''}. ` : ''}Selected: ${esc(d.why)}.${d.inheritedSplit ? ` Split inherited from the Visual Corpus (${esc(d.inheritedSplit)}).` : ''}</p></div>
  <div class="tabs">${[['layouts', 'Layouts & verdict'], ['landscape', 'Quality landscape'], ['compare', 'Compare'], ['play', 'Width playground'], ['process', 'Design process']].map(([k, l]) => `<button data-tab="${k}" class="${tab === k ? 'on' : ''}">${l}</button>`).join('')}</div>
  <div class="row">${hasShots ? `<span class="seg"><button data-mode="live" class="${mode === 'live' ? 'on' : ''}">Live render</button><button data-mode="shot" class="${mode === 'shot' ? 'on' : ''}">Corpus screenshot</button></span>` : ''}<span class="note">Live renders use the corpus CSS and widths in your browser's fonts; the measured geometry below is from the corpus build (Chromium, macOS fonts).</span></div>
  <div id="body"></div>`;
  m.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; draw(); });
  m.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { mode = b.dataset.mode; try { localStorage.setItem('gold-mode', mode); } catch (e) {} draw(); });
  ({ layouts, landscape, compare, play, process })[tab]($('#body'));
}

function card(d, c, extra = '') {
  const el = document.createElement('div'); el.className = 'card';
  const r = c.review;
  el.innerHTML = `<h3><span class="lab ${esc(c.label)}">${esc(c.label)}</span>${esc(c.name)}${d.top === c.name ? ' <span class="chip">top</span>' : ''}${(c.origins || [c.origin]).map(o => `<span class="chip">${esc(originName(o))}</span>`).join('')}${c.cls === 'scroll' ? '<span class="chip">scrolls</span>' : ''}</h3>
  <div class="meta">${c.idea ? esc(c.idea) : ''}${c.aliases && c.aliases.length ? ` · also produced as ${esc(c.aliases.join(', '))}` : ''}</div>`;
  el.appendChild(specimen(d, c));
  if (c.vp && mode === 'shot') { const v = specimen(d, c, 'vp'); v.style.marginTop = '8px'; el.appendChild(v); }
  const s = document.createElement('div');
  s.innerHTML = `${wbar(d, c.colWidths)}<div class="stats"><div>Blind grades<br><b>${r.grades.map(g => GR[g]).join(' · ')}</b></div><div>Mean score<br><b>${r.meanScore ?? '–'}</b></div><div>Named best<br><b>${r.bestVotes}/${r.grades.length}</b></div><div>Table<br><b>${Math.round(c.tableWidth)}×${Math.round(c.tableHeight)}px</b></div><div>Breaks inside a word<br><b>${c.breaks ? c.breaks.intraWord : '–'}</b></div><div>Overflow<br><b>${c.overflow > 0.5 ? Math.round(c.overflow) + 'px' : 'none'}</b></div></div>${dims(c)}
  <details><summary>Reviewer reasons</summary>${r.whys.map((w, i) => `<p class="why"><b>${GR[r.grades[i]]}${r.scores[i] != null ? ' · ' + r.scores[i] : ''}</b> — ${esc(w)}</p>`).join('')}</details>${extra}`;
  el.appendChild(s);
  return el;
}
function layouts(b) {
  const d = cur;
  const order = [...d.candidates].sort((a, c) => (c.review.medianGrade - a.review.medianGrade) || ((c.review.meanScore || 0) - (a.review.meanScore || 0)));
  b.innerHTML = `<p class="note">Status <b>${esc(d.status)}</b>: three independent blind reviewers rated every candidate (labels hidden, order shuffled). Gold = median ≥ good, ≥ 2 good votes and within 5 points of the best score in its class (${d.cond.policy === 'scroll-allowed' ? 'fitting and scrolling layouts are separate classes' : 'fit-only scenario'}). Origins are revealed here only.</p><div class="grid" id="cards"></div>`;
  const g = $('#cards'); order.forEach(c => g.appendChild(card(d, c)));
}
function landscape(b) {
  const d = cur, L = d.landscape;
  if (!L) { b.innerHTML = '<p class="note">No landscape for this scenario (the best layout was not a designed one).</p>'; return; }
  const ref = d.candidates.find(c => c.name === L.ref);
  const vs = [...L.variants].sort((a, c) => (c.meanDScore ?? -99) - (a.meanDScore ?? -99));
  if (!landSel) landSel = vs[0] && vs[0].name;
  b.innerHTML = `<p class="note">Controlled width changes around <b>${esc(L.ref)}</b> (total width kept). ${L.explored} variants were measured in the browser; ${L.exploredSameLines} of them keep every line break identical. The ${L.variants.length} below were rendered and rated blind together with the reference (hidden among them, 2 reviewers per batch). Δ = variant score − reference score from the same reviewer.</p>
  <table class="dat"><thead><tr><th>Variant</th><th>Change</th><th>Same lines</th><th>Same height</th><th>L1 px</th><th>Δ score</th><th>Grades</th></tr></thead><tbody>${vs.map(v => `<tr data-v="${esc(v.name)}" class="${landSel === v.name ? 'sel' : ''}"><td><b>${esc(v.name)}</b><br><span class="note">${esc(v.perturbation)}</span></td><td>${esc(v.how)}</td><td>${v.sameLinesAsRef ? 'yes' : 'no'}</td><td>${v.sameHeightAsRef ? 'yes' : 'no'}</td><td>${Math.round(v.l1)}</td><td class="${(v.meanDScore || 0) < -3 ? 'neg' : (v.meanDScore || 0) > 3 ? 'pos' : ''}"><b>${v.meanDScore ?? '–'}</b></td><td>${v.ratings.map(x => GR[x.grade]).join(' · ')}</td></tr>`).join('')}</tbody></table>
  <div class="two" style="margin-top:16px"><div id="lref"></div><div id="lvar"></div></div>
  <h4 style="margin:22px 0 6px">Column sensitivity of the reference</h4><p class="note">Smallest width moved out of a column (into its neighbour) that changes any cell's line count. 1px means the column sits exactly at a break threshold.</p>
  <table class="dat" style="max-width:560px"><thead><tr><th>Column</th><th>Neighbour</th><th>Change at</th></tr></thead><tbody>${(L.sensitivity || []).map(x => `<tr><td>${x.col}</td><td>${x.to ?? '–'}</td><td>${x.shrinkToChange ? x.shrinkToChange + 'px' : 'never (down to min width' + (x.robustUpTo ? ', ' + x.robustUpTo + 'px' : '') + ')'}</td></tr>`).join('')}</tbody></table>`;
  b.querySelectorAll('tr[data-v]').forEach(tr => tr.onclick = () => { landSel = tr.dataset.v; landscape(b); });
  const v = L.variants.find(x => x.name === landSel);
  const r1 = document.createElement('div'); r1.className = 'card'; r1.innerHTML = `<h3>Reference ${esc(L.ref)}</h3>`; r1.appendChild(specimen(d, ref)); r1.insertAdjacentHTML('beforeend', wbar(d, ref.colWidths));
  $('#lref').appendChild(r1);
  if (v) {
    const r2 = document.createElement('div'); r2.className = 'card'; r2.innerHTML = `<h3>${esc(v.name)} <span class="chip">${esc(v.perturbation)}</span></h3><div class="meta">${esc(v.why || '')}</div>`;
    r2.appendChild(specimen(d, v)); r2.insertAdjacentHTML('beforeend', wbar(d, v.colWidths, ref.colWidths) + `<details open><summary>Reviewer reasons</summary>${v.ratings.map(x => `<p class="why"><b>${GR[x.grade]} · ${x.score} (ref ${x.refScore}, Δ ${x.dScore})${x.indistinguishableFromRef ? ' · indistinguishable from ref' : ''}</b> — ${esc(x.why)}</p>`).join('')}</details>`);
    $('#lvar').appendChild(r2);
  }
}
function compare(b) {
  const d = cur, all = [...d.candidates.map(c => ({ ...c, kind: 'candidate' })), ...((d.landscape && d.landscape.variants) || []).map(v => ({ ...v, kind: 'landscape' }))];
  const sel = i => `<select data-i="${i}">${all.map(c => `<option value="${esc(c.name)}"${cmp[i] === c.name ? ' selected' : ''}>${esc(c.name)} — ${esc(c.kind === 'candidate' ? c.label : c.perturbation)}</option>`).join('')}</select>`;
  b.innerHTML = `<div class="row">A ${sel(0)} B ${sel(1)}</div><div class="two"><div id="ca"></div><div id="cb"></div></div><div class="card" style="margin-top:14px"><h3>Row heights (px)</h3><div id="rh"></div></div>`;
  b.querySelectorAll('select').forEach(s => s.onchange = () => { cmp[+s.dataset.i] = s.value; compare(b); });
  const [A, B] = cmp.map(n => all.find(c => c.name === n) || all[0]);
  [[A, '#ca'], [B, '#cb']].forEach(([c, s], k) => { const e = document.createElement('div'); e.className = 'card'; e.innerHTML = `<h3>${esc(c.name)}</h3>`; e.appendChild(specimen(d, c)); e.insertAdjacentHTML('beforeend', wbar(d, c.colWidths, k ? A.colWidths : null) + `<div class="stats"><div>Table<br><b>${Math.round(c.tableWidth)}×${Math.round(c.tableHeight)}</b></div><div>Breaks in a word<br><b>${c.breaks ? c.breaks.intraWord : '–'}</b></div></div>`); $(s).appendChild(e); });

}
function play(b) {
  const d = cur, top = d.candidates.find(c => c.name === d.top) || d.candidates[0];
  const ws = (top.requestedWidths || top.colWidths.map(Math.round)).slice();

  const pin = $('#pin');
  pin.innerHTML = ws.map((w, i) => `<label>col ${i + 1}<input type="number" min="20" max="900" value="${w}" data-i="${i}"></label>`).join('') + ' <button id="preset">Reset</button>';
  const upd = () => {
    const sum = ws.reduce((a, c) => a + c, 0);
    $('#psum').innerHTML = `Sum ${sum}px · ${sum <= d.cond.budget ? 'fits' : `<span class="neg">${sum - d.cond.budget}px over the viewport</span>`}`;
    const t = $('#pt'); t.innerHTML = ''; const sp = document.createElement('div'); sp.className = 'specimen'; sp.appendChild(tableNode(d, ws)); t.appendChild(sp);
    const h = sp.querySelector('table').getBoundingClientRect().height; $('#psum').insertAdjacentHTML('beforeend', ` · height ${Math.round(h)}px (top layout: ${Math.round(top.tableHeight)}px in the corpus build)`);
  };
  pin.querySelectorAll('input').forEach(inp => inp.oninput = () => { ws[+inp.dataset.i] = Math.max(20, +inp.value || 20); upd(); });
  $('#preset').onclick = () => play(b);

}
function list(xs) { return xs && xs.length ? `<ul>${xs.map(x => `<li>${esc(typeof x === 'string' ? x : JSON.stringify(x))}</li>`).join('')}</ul>` : '<p class="note">–</p>'; }

  <details><summary>Design rounds (${(d.history[k] || {}).rounds ? d.history[k].rounds.length : 0}) · stop: ${esc((d.history[k] || {}).stop)}</summary>${((d.history[k] || {}).rounds || []).map((r, i) => `<p class="why"><b>Round ${i}: ${esc(r.designs.join(', '))}${r.best ? ' · best so far ' + esc(r.best.join(', ')) : ''}</b>${(r.critique || []).map(c => `<br>· <b>${esc(c.design)}</b>: ${esc(c.good)} / <span class="neg">${esc(c.problems)}</span> — cause: ${esc(c.cause)}`).join('')}</p>`).join('')}</details></div>`).join('');
  b.innerHTML = `<div class="card prose"><h3>Synthesis</h3><p class="note">Designers' finalists were shown anonymised as ${esc(Object.entries(sy.letters || {}).map(([l, n]) => l + '=' + n).join(', '))}. Stop: ${esc(sy.stop)}.</p>
  <h4>Rationale</h4><p>${esc(sy.rationale)}</p><h4>General principles (candidate)</h4>${list(sy.principles && sy.principles.general)}<h4>Case-specific</h4>${list(sy.principles && sy.principles.specific)}<h4>Trade-offs</h4><p>${esc(sy.tradeoffs)}</p><h4>Uncertain</h4><p>${esc(sy.uncertain)}</p><h4>Same-function column groups</h4>${list((sy.sameFunctionGroups || []).map(g => `columns ${(g.columns || []).join(', ')} — ${g.same_scale ? 'same scale' : 'different scale'}: ${g.why}`))}
  <details><summary>Comparison rounds</summary>${(sy.rounds || []).map((r, i) => `<p class="why"><b>Round ${i}</b> · best: ${esc((r.best || []).join(', '))} · proposed: ${esc((r.proposed || []).join(', '))}<br>${esc(r.insights)}${(r.analysis || []).map(a => `<br>· <b>${esc(a.layout)}</b>: ${esc(a.strengths)} / <span class="neg">${esc(a.faults)}</span> — ${esc(a.spatial_logic)}`).join('')}</p>`).join('')}</details></div>
